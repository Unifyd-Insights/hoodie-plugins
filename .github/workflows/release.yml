name: Release

on:
  push:
    branches:
      - main

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  release:
    runs-on: ubuntu-latest
    # RELEASE_TOKEN belongs to a repo admin so the release commit can bypass main's branch
    # protection; the environment only allows main, so no other branch can read it.
    environment: release
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          # Otherwise semantic-release pushes with the default GITHUB_TOKEN, which branch protection rejects.
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Install dependencies
        run: npm ci

      - name: Release
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: npx semantic-release
